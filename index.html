<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado - Painel de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Cadastrar Produto</h2>
    <form id="formProduto">
        <input type="text" id="nome" placeholder="Nome do produto" required>
        <input type="number" id="preco" placeholder="Preço" step="0.01" required>
        <input type="text" id="categoria" placeholder="Categoria" required>
        <input type="text" id="quantidade" placeholder="Quantidade" required>
        <button type="submit" id="Botao">Salvar Produto</button>
    </form>

    <h2>Lista de Produtos</h2>
    <ul id="listaProdutos"></ul>

    <script src="script.js"></script>
</body>
</html>
